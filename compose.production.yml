services:
  api:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: production
      AUTH_MODE: supabase
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
